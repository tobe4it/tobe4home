---
###############################################################################
#
# Bergen Platform
#
# Role:
#   ollama
#
# Task:
#   Create required directories
#
###############################################################################

- name: Create Ollama directories

  ansible.builtin.file:

    path: "{{ item.path }}"

    state: directory

    owner: "{{ item.owner }}"

    group: "{{ item.group }}"

    mode: "{{ item.mode }}"

  loop:

    - path: "{{ ollama_models_path }}"
      owner: "{{ ollama_user }}"
      group: "{{ ollama_group }}"
      mode: "0755"

    - path: /etc/systemd/system/ollama.service.d
      owner: root
      group: root
      mode: "0755"
