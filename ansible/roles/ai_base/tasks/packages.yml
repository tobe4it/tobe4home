---
- name: APT-Paketindex aktualisieren
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: KI-Basispakete installieren
  ansible.builtin.apt:
    name: "{{ ai_base_packages }}"
    state: present

- name: GPU-Validierungswerkzeuge installieren
  ansible.builtin.apt:
    name: "{{ ai_gpu_validation_packages }}"
    state: present
    update_cache: true
  when: lxc_gpu.enabled | default(false) | bool
