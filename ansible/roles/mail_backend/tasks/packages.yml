---
- name: Preseed Postfix as an Internet site
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    value: Internet Site
    vtype: select

- name: Preseed Postfix mail name
  ansible.builtin.debconf:
    name: postfix
    question: postfix/mailname
    value: "{{ mail_backend_primary_domain }}"
    vtype: string

- name: Install Postfix, Dovecot and LDAP dependencies
  ansible.builtin.apt:
    name: "{{ mail_backend_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
