lxc_vmid: "{{ site_controller_vmid | mandatory }}"
lxc_hostname: "{{ site_controller_hostname | mandatory }}"

lxc_template: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst

lxc_storage: "{{ site_lxc_storage | mandatory }}"
lxc_rootfs_size: 20

lxc_memory: 4096
lxc_swap: 1024
lxc_cores: 2

lxc_bridge: "{{ site_controller_bridge | mandatory }}"

lxc_ip: dhcp
lxc_ip6: dhcp

lxc_unprivileged: true
lxc_onboot: true

lxc_firewall: 1

lxc_ssh_public_key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
lxc_root_password: "{{ vault_lxc_root_password }}"
