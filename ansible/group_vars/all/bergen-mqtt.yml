---
###############################################################################
# Bergen Platform
#
# LXC configuration: bergen-mqtt
#
# Dedicated MQTT broker for home automation and infrastructure messaging.
###############################################################################

lxc_vmid: "{{ site_mqtt_vmid | mandatory }}"
lxc_hostname: "{{ site_mqtt_hostname | mandatory }}"

lxc_template: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst

lxc_storage: "{{ site_lxc_storage | mandatory }}"
lxc_rootfs_size: 8

lxc_memory: 512
lxc_swap: 256
lxc_cores: 1

lxc_bridge: "{{ site_mqtt_bridge | mandatory }}"

lxc_ip: dhcp
lxc_ip6: dhcp

lxc_unprivileged: true
lxc_onboot: true
lxc_start_order: 20

lxc_firewall: 1

lxc_ssh_public_key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
lxc_root_password: "{{ vault_lxc_root_password }}"

# Set pve_node and pve_inventory_host in site.local.yml.

###############################################################################
# MQTT service accounts
#
# User identities and ACL policy are declarative. Credentials live only in the
# encrypted/local Ansible Vault and are referenced here by variable name.
###############################################################################

mqtt_users:
  - username: evcc
    password: "{{ vault_mqtt_evcc_password }}"
  - username: go-echarger
    password: "{{ vault_mqtt_go_echarger_password }}"

# Initial least-privilege policy derived from the currently known top-level
# topics. Extend this deliberately when another client/topic is migrated.
mqtt_acl_lines:
  - "user evcc"
  - "topic readwrite evcc/#"
  - "topic readwrite go-eCharger/#"
  - "user go-echarger"
  - "topic readwrite go-eCharger/#"
