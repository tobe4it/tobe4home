---
###############################################################################
# Bergen Platform
#
# LXC configuration: bergen-pihole
#
# Dedicated Pi-hole DNS filtering service.
###############################################################################

lxc_vmid: "{{ site_pihole_vmid | mandatory }}"
lxc_hostname: "{{ site_pihole_hostname | mandatory }}"

lxc_template: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst

lxc_storage: "{{ site_lxc_storage | mandatory }}"
lxc_rootfs_size: 8

lxc_memory: 1024
lxc_swap: 256
lxc_cores: 1

lxc_bridge: "{{ site_pihole_bridge | mandatory }}"

# Initial deployment uses DHCP so Bergen Platform can discover the new LXC.
# Before clients use Pi-hole, reserve the discovered address in UniFi.
lxc_ip: dhcp
lxc_ip6: dhcp

lxc_unprivileged: true
lxc_onboot: true
lxc_start_order: 10

lxc_firewall: 1

lxc_ssh_public_key: >-
  {{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}
lxc_root_password: "{{ vault_lxc_root_password }}"

# pve_node and pve_inventory_host must be defined in ignored site.local.yml.

###############################################################################
# Central logging
###############################################################################

remote_syslog_enabled: true
# remote_syslog_server must be defined in ignored site.local.yml.
remote_syslog_port: 514
remote_syslog_protocol: tcp
remote_syslog_send_test: true

###############################################################################
# Pi-hole
###############################################################################

# Pin deployments to an explicit upstream release. Upgrade deliberately in Git.
pihole_image: docker.io/pihole/pihole:2026.07.2

pihole_timezone: Europe/Berlin

# Preserve the existing internal DNS authority and split-DNS behavior.
# Do not point Synology DNS back to Pi-hole or to a resolver that forwards to
# Pi-hole, otherwise a DNS forwarding loop is created.
pihole_upstreams: []  # Populate via ignored site.local.yml.

# The LXC has one routed service interface. SINGLE accepts queries from routed
# VLANs on that interface while avoiding listeners on unrelated interfaces.
pihole_dns_interface: eth0
pihole_dns_listening_mode: SINGLE

pihole_query_logging: true
pihole_dnssec: false
pihole_dhcp_enabled: false
pihole_ntp_enabled: false

# Network-wide SafeSearch / Restricted Mode.
# Pi-hole's embedded dnsmasq cannot reliably CNAME an external target unless
# that target is locally authoritative/cached, so map the provider hostnames
# directly to their SafeSearch VIPs instead.
#
# Google SafeSearch VIP: 216.239.38.120
# Bing Strict VIP:       204.79.197.220
# YouTube Moderate VIP:  216.239.38.119
#
# YouTube uses Moderate Restricted Mode globally; a stricter children-only
# resolver can be added later.
pihole_dnsmasq_lines:
  - "address=/www.google.com/216.239.38.120"
  - "address=/www.google.de/216.239.38.120"
  - "address=/www.bing.com/204.79.197.220"
  - "address=/edgeservices.bing.com/204.79.197.220"
  - "address=/www.youtube.com/216.239.38.119"
  - "address=/m.youtube.com/216.239.38.119"
  - "address=/youtubei.googleapis.com/216.239.38.119"
  - "address=/youtube.googleapis.com/216.239.38.119"
  - "address=/www.youtube-nocookie.com/216.239.38.119"

# Secret is stored only in ansible/group_vars/all/vault.yml.
pihole_web_password: "{{ vault_pihole_web_password }}"
