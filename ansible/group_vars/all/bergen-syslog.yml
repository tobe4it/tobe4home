---
###############################################################################
# Bergen Platform
#
# LXC configuration: bergen-syslog
#
# Central syslog collector for network, server and appliance logs.
###############################################################################

lxc_vmid: "{{ site_syslog_vmid | mandatory }}"
lxc_hostname: "{{ site_syslog_hostname | mandatory }}"

lxc_template: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst

lxc_storage: "{{ site_lxc_storage | mandatory }}"
lxc_rootfs_size: 20

lxc_memory: 1024
lxc_swap: 512
lxc_cores: 2

lxc_bridge: "{{ site_syslog_bridge | mandatory }}"

lxc_ip: dhcp
lxc_ip6: dhcp

lxc_unprivileged: true
lxc_onboot: true

lxc_firewall: 1

lxc_ssh_public_key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
lxc_root_password: "{{ vault_lxc_root_password }}"

# Set pve_node and pve_inventory_host in site.local.yml.
