---
###############################################################################
# Bergen Platform
#
# Bootstrap eines zentralen Syslog-Knotens.
#
# Das Playbook setzt auf einem zuvor mit deploy-lxc.yml vorbereiteten
# Debian-LXC den zentralen Syslog-Empfaenger auf.
###############################################################################

- name: Bootstrap Bergen Platform syslog node
  hosts: "{{ bootstrap_syslog_target | default('syslog_nodes') }}"
  become: true
  gather_facts: true

  roles:
    - role: lxc_base
      tags:
        - base

    - role: syslog
      tags:
        - logging
        - syslog
