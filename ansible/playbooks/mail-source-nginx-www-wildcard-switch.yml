---
# Guarded migration of exactly one nginx TLS virtual host to an existing,
# valid wildcard certificate. Default: read-only. Real names only in local vars.
- name: Register approved source and validate local scope
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Require reviewed source and WWW vhost settings
      ansible.builtin.assert:
        that:
          - mail_tls_source_address is defined
          - mail_tls_source_ssh_user is defined
          - mail_tls_source_cert_file is defined
          - mail_tls_source_cert_file is match('^/etc/letsencrypt/live/[A-Za-z0-9._-]+/fullchain[.]pem$')
          - selfhost_acme_zone is defined
          - selfhost_acme_zone is match('^[a-z0-9.-]+$')
          - nginx_www_config_path is defined
          - nginx_www_config_path is match('^/etc/nginx/conf[.]d/[A-Za-z0-9._-]+[.]conf$')
          - nginx_www_legacy_lineage is defined
          - nginx_www_legacy_lineage is match('^[a-zA-Z0-9._-]+$')
          - nginx_www_legacy_lineage != (mail_tls_source_cert_file | dirname | basename)
          - not ansible_check_mode
        fail_msg: Missing or unapproved locally configured nginx vhost scope.
      no_log: true
    - name: Register configured external certificate source
      ansible.builtin.add_host:
        name: nginx-www-wildcard-source
        groups: nginx_www_wildcard_sources
        ansible_host: "{{ mail_tls_source_address }}"
        ansible_user: "{{ mail_tls_source_ssh_user }}"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

- name: Preflight or expressly switch one nginx WWW vhost
  hosts: nginx_www_wildcard_sources
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    www_name: "www.{{ selfhost_acme_zone }}"
    old_chain: "/etc/letsencrypt/live/{{ nginx_www_legacy_lineage }}/fullchain.pem"
    old_key: "/etc/letsencrypt/live/{{ nginx_www_legacy_lineage }}/privkey.pem"
    new_chain: "{{ mail_tls_source_cert_file }}"
    new_key: "{{ mail_tls_source_cert_file | dirname }}/privkey.pem"
    backup_path: /var/lib/selfhost-acme/nginx-www-before-wildcard-switch.conf
  tasks:
    - name: Require prospective replacement certificate valid for another 30 days
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ new_chain }}", -noout, -checkend, "2592000"]
      register: nginx_new_cert_valid
      changed_when: false
      no_log: true

    - name: Verify replacement certificate covers only the intended WWW hostname
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ new_chain }}", -noout, -checkhost, "{{ www_name }}"]
      register: nginx_new_cert_name
      changed_when: false
      no_log: true

    - name: Refuse certificate not matching WWW hostname
      ansible.builtin.assert:
        that:
          - "'does match certificate' in nginx_new_cert_name.stdout"
        fail_msg: Replacement certificate is not proven valid for the WWW hostname.

    - name: Confirm Nginx configuration is valid before considering any change
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false
      no_log: true

    - name: Confirm target configuration is actually included in nginx -T
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import subprocess
            import sys

            chosen = sys.argv[1]
            try:
                result = subprocess.run(
                    ['nginx', '-T'], capture_output=True, text=True,
                    timeout=20, check=False)
            except (OSError, subprocess.TimeoutExpired):
                print('nginx_active_config=UNAVAILABLE')
                raise SystemExit(2)
            if result.returncode:
                print('nginx_active_config=INVALID')
                raise SystemExit(2)
            markers = [
                line.strip() for line in result.stdout.splitlines()
                if line.startswith('# configuration file ')
            ]
            expected = '# configuration file ' + chosen + ':'
            if markers.count(expected) != 1:
                print('nginx_active_config=NOT_UNIQUELY_INCLUDED')
                raise SystemExit(2)
            print('nginx_active_config=VERIFIED')
          - "{{ nginx_www_config_path }}"
      changed_when: false
      register: nginx_www_active_config_guard
      no_log: true

    - name: Verify existing replacement certificate and key form one pair
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import subprocess
            import sys

            cert, key = sys.argv[1:3]
            checks = [
                ['openssl', 'x509', '-noout', '-pubkey', '-in', cert],
                ['openssl', 'pkey', '-pubout', '-in', key],
            ]
            outputs = []
            for command in checks:
                try:
                    result = subprocess.run(
                        command, capture_output=True, timeout=10, check=False)
                except (OSError, subprocess.TimeoutExpired):
                    print('tls_keypair=UNREADABLE')
                    raise SystemExit(2)
                if result.returncode:
                    print('tls_keypair=UNREADABLE')
                    raise SystemExit(2)
                outputs.append(result.stdout.strip())
            if outputs[0] != outputs[1]:
                print('tls_keypair=MISMATCH')
                raise SystemExit(2)
            print('tls_keypair=MATCH')
          - "{{ new_chain }}"
          - "{{ new_key }}"
      changed_when: false
      register: nginx_www_keypair_guard
      no_log: true

    - name: Check exact intended configuration file without following symlinks
      ansible.builtin.stat:
        path: "{{ nginx_www_config_path }}"
        follow: false
      register: nginx_www_config_stat

    - name: Resolve only the approved sites-available counterpart for a symlink
      ansible.builtin.set_fact:
        nginx_www_edit_path: >-
          {{ '/etc/nginx/sites-available/' ~ (nginx_www_config_path | basename)
             if (nginx_www_config_stat.stat.islnk | default(false))
             else nginx_www_config_path }}
      no_log: true

    - name: Require a direct symlink to precisely the matching sites-available file
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os
            import sys
            from pathlib import Path

            link, target = map(Path, sys.argv[1:3])
            if not link.is_symlink():
                print('nginx_symlink=NOT_A_LINK')
                raise SystemExit(2)
            try:
                raw = os.readlink(link)
                destination = (link.parent / raw).resolve(strict=True)
                if destination != target or target.is_symlink() or not target.is_file():
                    print('nginx_symlink=UNEXPECTED_TARGET')
                    raise SystemExit(2)
            except (OSError, RuntimeError):
                print('nginx_symlink=UNREADABLE')
                raise SystemExit(2)
            print('nginx_symlink=APPROVED_TARGET')
          - "{{ nginx_www_config_path }}"
          - "{{ nginx_www_edit_path }}"
      changed_when: false
      no_log: true
      when: nginx_www_config_stat.stat.islnk | default(false)

    - name: Inspect the actual approved configuration file without following links
      ansible.builtin.stat:
        path: "{{ nginx_www_edit_path }}"
        follow: false
      register: nginx_www_edit_stat

    - name: Require a regular approved edit target and no symlink at that path
      ansible.builtin.assert:
        that:
          - nginx_www_edit_stat.stat.isreg | default(false)
          - not (nginx_www_edit_stat.stat.islnk | default(false))
          - nginx_www_edit_path == nginx_www_config_path or
            nginx_www_edit_path == '/etc/nginx/sites-available/' ~ (nginx_www_config_path | basename)
        fail_msg: Refusing unsafe Nginx file or unapproved symlink target.

    - name: Load exact WWW nginx configuration privately
      ansible.builtin.slurp:
        src: "{{ nginx_www_edit_path }}"
      register: nginx_www_original
      no_log: true

    - name: Determine whether exact old or new certificate pair is configured
      ansible.builtin.set_fact:
        nginx_www_old_pair: >-
          {{ (nginx_www_original.content | b64decode).count(old_chain) == 1
             and (nginx_www_original.content | b64decode).count(old_key) == 1
             and (nginx_www_original.content | b64decode).count(new_chain) == 0
             and (nginx_www_original.content | b64decode).count(new_key) == 0 }}
        nginx_www_new_pair: >-
          {{ (nginx_www_original.content | b64decode).count(old_chain) == 0
             and (nginx_www_original.content | b64decode).count(old_key) == 0
             and (nginx_www_original.content | b64decode).count(new_chain) == 1
             and (nginx_www_original.content | b64decode).count(new_key) == 1 }}
        nginx_www_names_confirmed: >-
          {{ (nginx_www_original.content | b64decode) is search('(?m)^[ \t]*server_name[ \t]+'
             ~ (www_name | regex_escape) ~ '[ \t]*;') }}
      no_log: true

    - name: Require a unique exact old or already-migrated certificate pair
      ansible.builtin.assert:
        that:
          - nginx_www_names_confirmed | bool
          - (nginx_www_old_pair | bool) or (nginx_www_new_pair | bool)
        fail_msg: WWW virtual host name or TLS paths are ambiguous. Stop.

    - name: Inspect whether previous backup exists
      ansible.builtin.stat:
        path: "{{ backup_path }}"
        follow: false
      register: nginx_www_backup_stat

    - name: Prevent overwriting an older root-only safety backup
      ansible.builtin.assert:
        that:
          - not (nginx_www_backup_stat.stat.exists | default(false))
        fail_msg: Earlier backup exists; review before applying anything.
      when:
        - nginx_www_apply | default(false) | bool
        - nginx_www_old_pair | bool

    - name: Show planned action without changing Nginx
      ansible.builtin.debug:
        msg:
          apply_authorized: "{{ nginx_www_apply | default(false) | bool }}"
          state: "{{ 'READY' if nginx_www_old_pair | bool else 'ALREADY_CONFIGURED' }}"
          planned_scope: single_www_virtual_host
          cloud_virtual_host_modified: false

    - name: Safely replace only two certificate references with explicit authorization
      when:
        - nginx_www_apply | default(false) | bool
        - nginx_www_old_pair | bool
      block:
        - name: Preserve original Nginx vhost under root-only state directory
          ansible.builtin.copy:
            src: "{{ nginx_www_edit_path }}"
            dest: "{{ backup_path }}"
            remote_src: true
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Replace only old certificate chain path
          ansible.builtin.replace:
            path: "{{ nginx_www_edit_path }}"
            regexp: "{{ old_chain | regex_escape }}"
            replace: "{{ new_chain }}"
          no_log: true

        - name: Replace only old private key path
          ansible.builtin.replace:
            path: "{{ nginx_www_edit_path }}"
            regexp: "{{ old_key | regex_escape }}"
            replace: "{{ new_key }}"
          no_log: true

        - name: Require valid Nginx configuration before activation
          ansible.builtin.command:
            argv: [nginx, -t]
          changed_when: false
          no_log: true

        - name: Activate checked Nginx configuration by graceful reload
          ansible.builtin.command:
            argv: [systemctl, reload, nginx]

        - name: Verify local WWW TLS now serves the exact expected leaf certificate
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import hashlib
                import re
                import socket
                import ssl
                import sys
                from pathlib import Path

                cert = Path(sys.argv[1]).read_text(encoding='ascii')
                match = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',
                                  cert, re.S)
                if not match:
                    raise SystemExit(2)
                expected = ssl.PEM_cert_to_DER_cert(match.group(0))
                ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                ctx.check_hostname = False
                ctx.verify_mode = ssl.CERT_NONE
                with socket.create_connection(('127.0.0.1', 443), timeout=10) as connection:
                    with ctx.wrap_socket(connection, server_hostname=sys.argv[2]) as tls:
                        observed = tls.getpeercert(binary_form=True)
                if hashlib.sha256(observed).digest() != hashlib.sha256(expected).digest():
                    print('www_tls_leaf=NOT_YET_EXPECTED')
                    raise SystemExit(2)
                print('www_tls_leaf=EXPECTED_NEW_CERTIFICATE')
              - "{{ new_chain }}"
              - "{{ www_name }}"
          changed_when: false
          register: nginx_www_tls_postcheck
          no_log: true

      rescue:
        - name: Restore original WWW configuration after failed validation
          ansible.builtin.copy:
            src: "{{ backup_path }}"
            dest: "{{ nginx_www_edit_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "{{ nginx_www_edit_stat.stat.mode }}"
          no_log: true

        - name: Verify restored Nginx configuration
          ansible.builtin.command:
            argv: [nginx, -t]
          changed_when: false
          no_log: true

        - name: Reload restored configuration
          ansible.builtin.command:
            argv: [systemctl, reload, nginx]

        - name: Refuse to report success after rollback
          ansible.builtin.fail:
            msg: WWW TLS switch failed; original configuration restored. Investigate before retry.

    - name: Show status after guarded switch
      ansible.builtin.debug:
        msg:
          configuration: >-
            {{ 'READY_FOR_EXPLICIT_APPLY' if not (nginx_www_apply | default(false) | bool)
               else ('WWW_SWITCHED_AND_TLS_VERIFIED' if nginx_www_old_pair | bool
                     else 'WWW_ALREADY_CONFIGURED') }}
          cloud_virtual_host_modified: false
          legacy_certificate_removed: false
