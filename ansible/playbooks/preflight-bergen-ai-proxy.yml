---
# Read-only preflight. Uses the already established Proxmox transport.
# No service changes, certificate copies, SSH connections or DNS writes.
- name: Inspect existing HTTPS proxy before adding Bergen-AI
  hosts: proxmox_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Require exact reviewed Proxmox target before inspecting proxy
      ansible.builtin.assert:
        that:
          - site_pve_inventory_host is defined
          - site_pve_inventory_host in groups.get('proxmox_hosts', [])
          - site_ai_proxy_vmid is defined
          - site_ai_proxy_hostname is defined
          - paperless_proxy_hostname is defined
          - ai_proxy_hostname is defined
        fail_msg: >-
          The reviewed local Proxmox host or required site variables are missing;
          refusing to inspect any unrelated node.

    - name: Skip Proxmox hosts other than the locally selected target
      ansible.builtin.meta: end_host
      when: inventory_hostname != site_pve_inventory_host

    - name: Verify existing proxy LXC identity
      ansible.builtin.command:
        argv: [pct, exec, "{{ site_ai_proxy_vmid | mandatory }}", --, hostname, -s]
      register: ai_proxy_identity
      changed_when: false
      failed_when: ai_proxy_identity.stdout | trim != (site_ai_proxy_hostname | mandatory)

    - name: Inspect existing Paperless path, AI name, TLS and port
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ site_ai_proxy_vmid | mandatory }}"
          - --
          - python3
          - -c
          - |
            import pathlib
            import socket
            import subprocess
            import sys

            def run(args):
                try:
                    return subprocess.run(args, capture_output=True, text=True, timeout=8, check=False)
                except (OSError, subprocess.TimeoutExpired):
                    return None

            paperless = pathlib.Path('/etc/nginx/sites-enabled/50-internal-paperless.' + sys.argv[1] + '.conf')
            ai = pathlib.Path('/etc/nginx/sites-enabled/50-internal-ai.' + sys.argv[2] + '.conf')
            print('PAPERLESS_VHOST_PRESENT', paperless.is_file())
            print('AI_VHOST_PRESENT', ai.exists() or ai.is_symlink())
            for port in (18000, 13000, 443):
                sock = socket.socket()
                try:
                    sock.settimeout(1)
                    occupied = sock.connect_ex(('127.0.0.1', port)) == 0
                finally:
                    sock.close()
                print('LOCAL_TCP_' + str(port), 'LISTENING' if occupied else 'NOT_LISTENING')
            for hostname in (sys.argv[1], sys.argv[2]):
                try:
                    addresses = sorted({x[4][0] for x in socket.getaddrinfo(
                        hostname, None, family=socket.AF_INET)})
                except socket.gaierror:
                    addresses = []
                print('DNS_' + hostname, ','.join(addresses) or 'UNRESOLVED')
            cert = pathlib.Path('/etc/nginx/tls/fullchain.pem')
            if cert.is_file():
                check = run(['openssl', 'x509', '-in', str(cert), '-noout',
                             '-checkhost', sys.argv[2]])
                print('CERT_COVERS_AI', bool(check and check.returncode == 0
                     and 'does match certificate' in check.stdout))
            else:
                print('CERT_COVERS_AI', False)
            nginx = run(['nginx', '-t'])
            print('NGINX_TEST_OK', bool(nginx and nginx.returncode == 0))
            print('NOTICE read-only; no key contents or SSH configuration printed')
          - "{{ paperless_proxy_hostname | mandatory }}"
          - "{{ ai_proxy_hostname | mandatory }}"
      register: ai_proxy_readiness
      changed_when: false

    - name: Show sanitized readiness indicators
      ansible.builtin.debug:
        var: ai_proxy_readiness.stdout_lines

    - name: Require successful read-only inspection
      ansible.builtin.assert:
        that:
          - ai_proxy_readiness.rc == 0
          - "'PAPERLESS_VHOST_PRESENT True' in ai_proxy_readiness.stdout"
          - "'NGINX_TEST_OK True' in ai_proxy_readiness.stdout"
        fail_msg: 'Existing Paperless proxy or Nginx baseline is not ready.'
