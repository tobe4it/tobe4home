---
###############################################################################
#
# Bergen Platform
#
# Playbook:
#   discover-lxc.yml
#
# Purpose:
#   Discover the effective runtime configuration of an existing Proxmox LXC.
#
# Responsibilities:
#   - Validate required discovery variables
#   - Verify that the LXC exists
#   - Verify that the LXC is running
#   - Discover its effective IPv4 address
#   - Read the effective Proxmox LXC configuration
#   - Extract bridge and MAC address
#   - Verify SSH reachability
#   - Add the LXC to the temporary Ansible runtime inventory
#
# Check mode:
#   - All read-only discovery operations are executed
#   - No LXC state is changed
#   - The persistent inventory is not modified
#
# Not included:
#   - Creating the LXC
#   - Starting or restarting the LXC
#   - Persistently modifying ansible/inventory.yml
#   - Applying the Linux baseline
#
###############################################################################

- name: Discover Proxmox LXC runtime configuration
  hosts: "{{ pve_inventory_host | default(pve_node) }}"
  gather_facts: false

  tasks:
    ###########################################################################
    # Validation
    ###########################################################################

    - name: Erforderliche Discovery-Variablen prüfen
      ansible.builtin.assert:
        that:
          - pve_node is defined
          - pve_node | string | length > 0

          - lxc_vmid is defined
          - lxc_vmid | int > 0

          - lxc_hostname is defined
          - lxc_hostname | string | length > 0

        fail_msg: >-
          Für die Ermittlung des LXC fehlen erforderliche Variablen.
          Prüfe die übergebene Variablendatei.

        success_msg: >-
          Alle erforderlichen Discovery-Variablen sind vorhanden.

    ###########################################################################
    # LXC state
    ###########################################################################

    - name: LXC-Status prüfen
      ansible.builtin.raw: >-
        /usr/sbin/pct status {{ lxc_vmid }}
      register: lxc_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Vorhandensein des LXC prüfen
      ansible.builtin.assert:
        that:
          - lxc_status.rc | default(1) == 0
          - "'status:' in (lxc_status.stdout | default(''))"

        fail_msg: >-
          Der LXC {{ lxc_hostname }} mit VMID {{ lxc_vmid }}
          wurde auf {{ inventory_hostname }} nicht gefunden.

        success_msg: >-
          Der LXC {{ lxc_hostname }} mit VMID {{ lxc_vmid }}
          ist vorhanden.

    - name: Laufenden LXC voraussetzen
      ansible.builtin.assert:
        that:
          - "'status: running' in (lxc_status.stdout | default(''))"

        fail_msg: >-
          Der LXC {{ lxc_hostname }} mit VMID {{ lxc_vmid }}
          läuft nicht. Führe zuvor restart-lxc.yml aus.

        success_msg: >-
          Der LXC {{ lxc_hostname }} läuft.

    ###########################################################################
    # IPv4 discovery
    ###########################################################################

    - name: Auf eine IPv4-Adresse im LXC warten
      ansible.builtin.raw: >-
        /usr/sbin/pct exec {{ lxc_vmid }} --
        hostname -I
      register: lxc_ipv4_output
      changed_when: false
      failed_when: false
      check_mode: false
      retries: "{{ lxc_discovery_retries | default(24) }}"
      delay: "{{ lxc_discovery_delay | default(5) }}"
      until:
        - lxc_ipv4_output.rc | default(1) == 0
        - >-
          (
            lxc_ipv4_output.stdout
            | default('')
            | regex_findall(
                '(?:^|\\s)([0-9]{1,3}(?:\\.[0-9]{1,3}){3})(?:\\s|$)'
              )
            | length
          ) > 0

    - name: Ermittelte IPv4-Adresse validieren
      ansible.builtin.assert:
        that:
          - lxc_ipv4_output.rc | default(1) == 0
          - >-
            (
              lxc_ipv4_output.stdout
              | default('')
              | regex_findall(
                  '(?:^|\\s)([0-9]{1,3}(?:\\.[0-9]{1,3}){3})(?:\\s|$)'
                )
              | length
            ) > 0

        fail_msg: >-
          Für den LXC {{ lxc_hostname }} mit VMID {{ lxc_vmid }}
          konnte keine IPv4-Adresse ermittelt werden.

        success_msg: >-
          Eine IPv4-Adresse wurde erfolgreich ermittelt.

    - name: IPv4-Rohdaten anzeigen
      ansible.builtin.debug:
        msg:
          - "stdout={{ lxc_ipv4_output.stdout }}"
          - "stdout_lines={{ lxc_ipv4_output.stdout_lines }}"

    - name: Effektive IPv4-Adresse setzen
      ansible.builtin.set_fact:
        lxc_effective_ipv4: "{{ lxc_ipv4_output.stdout.split() | first }}"

    - name: Effektive IPv4-Adresse prüfen
      ansible.builtin.assert:
        that:
          - lxc_effective_ipv4 is defined
          - lxc_effective_ipv4 | string | length > 0
          - lxc_effective_ipv4 is ansible.utils.ipv4

        fail_msg: >-
          Der ermittelte Wert {{ lxc_effective_ipv4 | default('') }}
          ist keine gültige IPv4-Adresse.

        success_msg: >-
          Die IPv4-Adresse {{ lxc_effective_ipv4 }} ist gültig.

    ###########################################################################
    # Proxmox configuration discovery
    ###########################################################################

    - name: Effektive Proxmox-LXC-Konfiguration lesen
      ansible.builtin.raw: >-
        /usr/sbin/pct config {{ lxc_vmid }}
      register: lxc_config_output
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Proxmox-LXC-Konfiguration validieren
      ansible.builtin.assert:
        that:
          - lxc_config_output.rc | default(1) == 0
          - lxc_config_output.stdout | default('') | trim | length > 0
          - "'net0:' in (lxc_config_output.stdout | default(''))"

        fail_msg: >-
          Die effektive Proxmox-Konfiguration für LXC {{ lxc_vmid }}
          konnte nicht vollständig gelesen werden.

        success_msg: >-
          Die effektive Proxmox-Konfiguration wurde gelesen.

    - name: Effektive LXC-Netzwerkdaten setzen
      ansible.builtin.set_fact:
        lxc_effective_mac: >-
          {{
            (
              lxc_config_output.stdout
              | default('')
              | regex_findall('hwaddr=([^,\\r\\n]+)')
              | first
            )
            | default('nicht ermittelt', true)
          }}

        lxc_effective_bridge: >-
          {{
            (
              lxc_config_output.stdout
              | default('')
              | regex_findall('bridge=([^,\\r\\n]+)')
              | first
            )
            | default(
                lxc_bridge | default('nicht ermittelt'),
                true
              )
          }}

    - name: Ermittelte Netzwerkdaten validieren
      ansible.builtin.assert:
        that:
          - lxc_effective_bridge | string | length > 0
          - lxc_effective_mac | string | length > 0

        fail_msg: >-
          Bridge oder MAC-Adresse konnten für LXC {{ lxc_vmid }}
          nicht ermittelt werden.

        success_msg: >-
          Bridge und MAC-Adresse wurden ermittelt.

    ###########################################################################
    # SSH reachability
    ###########################################################################

    - name: Auf SSH-Erreichbarkeit warten
      ansible.builtin.wait_for:
        host: "{{ lxc_effective_ipv4 }}"
        port: "{{ lxc_ansible_port | default(22) }}"
        state: started
        connect_timeout: 5
        sleep: 5
        timeout: "{{ lxc_ssh_timeout | default(180) }}"
      delegate_to: localhost
      check_mode: false

    ###########################################################################
    # Temporary runtime inventory
    ###########################################################################

    - name: LXC zum temporären Laufzeit-Inventar hinzufügen
      ansible.builtin.add_host:
        name: "{{ lxc_hostname }}"

        groups: >-
          {{
            ['discovered_lxcs', 'linux_lxcs']
            +
            (
              [lxc_inventory_group]
              if lxc_inventory_group is defined
              else []
            )
          }}

        ansible_host: "{{ lxc_effective_ipv4 }}"
        ansible_user: "{{ lxc_ansible_user | default('root') }}"
        ansible_port: "{{ lxc_ansible_port | default(22) }}"
        ansible_python_interpreter: /usr/bin/python3

        lxc_deployed_vmid: "{{ lxc_vmid }}"
        lxc_deployed_ipv4: "{{ lxc_effective_ipv4 }}"
        lxc_deployed_mac: "{{ lxc_effective_mac }}"
        lxc_deployed_bridge: "{{ lxc_effective_bridge }}"

      changed_when: false

    - name: Laufzeit-Inventareintrag validieren
      ansible.builtin.assert:
        that:
          - hostvars[lxc_hostname] is defined
          - hostvars[lxc_hostname].ansible_host is defined
          - >-
            hostvars[lxc_hostname].ansible_host
            == lxc_effective_ipv4

        fail_msg: >-
          Der LXC {{ lxc_hostname }} konnte nicht korrekt zum
          temporären Laufzeit-Inventar hinzugefügt werden.

        success_msg: >-
          Der LXC {{ lxc_hostname }} wurde zum temporären
          Laufzeit-Inventar hinzugefügt.

    ###########################################################################
    # Result
    ###########################################################################

    - name: Discovery-Ergebnis anzeigen
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Bergen Platform LXC erfolgreich ermittelt"
          - "============================================================"
          - "Hostname : {{ lxc_hostname }}"
          - "VMID     : {{ lxc_vmid }}"
          - "Node     : {{ pve_node }}"
          - "Bridge   : {{ lxc_effective_bridge }}"
          - "MAC      : {{ lxc_effective_mac }}"
          - "IPv4     : {{ lxc_effective_ipv4 }}"
          - "Status   : running"
          - "SSH-Port : {{ lxc_ansible_port | default(22) }}"
          - ""
          - "SSH:"
          - >-
            ssh
            {{ lxc_ansible_user | default('root') }}@{{ lxc_effective_ipv4 }}
          - ""
          - "Temporäre Gruppen:"
          - "  discovered_lxcs"
          - "  linux_lxcs"
          - ""
          - "Inventory-Eintrag:"
          - "  {{ lxc_hostname }}:"
          - "    ansible_host: {{ lxc_effective_ipv4 }}"
          - ""
          - "Nächster Schritt:"
          - >-
            Die persistente Inventory-Aktualisierung erfolgt durch
            update-inventory.yml.
          - "============================================================"

