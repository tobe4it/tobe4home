---
###############################################################################
# Bergen Platform
#
# Complete first deployment of the dedicated EVCC LXC.
#
# The EVCC service is installed but deliberately remains stopped and disabled.
# migrate-evcc.yml performs the single-controller cutover after it has copied
# and validated the existing configuration and database.
###############################################################################

- name: Validate EVCC LXC identity before provisioning
  hosts: "{{ pve_inventory_host | default(pve_node) }}"
  become: true
  gather_facts: false

  tasks:
    - name: Check whether the requested VMID already exists
      ansible.builtin.command:
        argv:
          - pct
          - config
          - "{{ lxc_vmid | string }}"
      register: evcc_existing_lxc
      changed_when: false
      failed_when: false

    - name: Reject an occupied VMID belonging to another LXC
      ansible.builtin.assert:
        that:
          - >-
            evcc_existing_lxc.rc != 0
            or
            ('hostname: ' ~ lxc_hostname) in evcc_existing_lxc.stdout
        fail_msg: >-
          VMID {{ lxc_vmid }} already exists but is not {{ lxc_hostname }}.
          Choose another lxc_vmid before provisioning.
        success_msg: >-
          VMID {{ lxc_vmid }} is free or already belongs to {{ lxc_hostname }}.

- import_playbook: create-lxc.yml

- import_playbook: restart-lxc.yml

- import_playbook: discover-lxc.yml

- import_playbook: bootstrap-evcc.yml
  vars:
    bootstrap_evcc_target: discovered_lxcs
    evcc_migration_staging: true

- name: Summarize staged EVCC deployment
  hosts: "{{ bootstrap_evcc_target | default('discovered_lxcs') }}"
  gather_facts: false

  tasks:
    - name: Report migration-ready EVCC LXC
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Bergen Platform EVCC LXC is ready for migration"
          - "============================================================"
          - "Hostname : {{ inventory_hostname }}"
          - "Address  : {{ ansible_host }}"
          - "EVCC     : installed, stopped and disabled"
          - "Next     : reserve this address and run migrate-evcc.yml"
          - "Warning  : do not start both EVCC instances"
          - "============================================================"
