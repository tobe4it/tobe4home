---
# READ ONLY. No Ansible role, service reload, LDAP writes, SMTP traffic,
# Paperless API changes or message movement is performed by this playbook.
- name: Audit prerequisites for Paperless SMTP-to-IMAP intake
  hosts: mail_backend_nodes
  become: true
  gather_facts: false
  vars:
    paperless_audit_account: "{{ mail_backend_paperless_account | default('paperless') }}"
    paperless_audit_alias_map: "{{ mail_backend_alias_map | default('/etc/postfix/virtual_aliases') }}"
    paperless_audit_address: "{{ paperless_audit_account }}@{{ mail_backend_primary_domain }}"
  tasks:
    - name: Validate audit inputs
      ansible.builtin.assert:
        that:
          - mail_backend_primary_domain | length > 0
          - paperless_audit_account | length > 0
          - mail_backend_paperless_scan_domain | length > 0
          - mail_backend_paperless_scan_domain in mail_backend_identity_domains
        fail_msg: >-
          Load the ignored live bergen-mail site variables (and LDAP secrets
          through Vault) before auditing, without enabling the intake role.

    - name: Check dedicated LDAP mailbox identity
      ansible.builtin.command:
        argv: [doveadm, user, "{{ paperless_audit_address }}"]
      register: paperless_audit_ldap
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check existing mailbox folders
      ansible.builtin.command:
        argv: [doveadm, mailbox, list, -u, "{{ paperless_audit_address }}"]
      register: paperless_audit_folders
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check Postfix recipient delimiter
      ansible.builtin.command:
        argv: [postconf, -h, recipient_delimiter]
      register: paperless_audit_postfix_delimiter
      changed_when: false

    - name: Check current Sieve package installation
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Status}", dovecot-sieve]
      register: paperless_audit_package
      changed_when: false
      failed_when: false

    - name: Check active Dovecot recipient delimiter
      ansible.builtin.command:
        argv: [doveconf, -h, recipient_delimiter]
      register: paperless_audit_dovecot_delimiter
      changed_when: false
      failed_when: false

    - name: Read current scan alias resolution (family)
      ansible.builtin.command:
        argv:
          - postmap
          - -q
          - "scan-familie@{{ mail_backend_paperless_scan_domain }}"
          - "hash:{{ paperless_audit_alias_map }}"
      register: paperless_audit_family_alias
      changed_when: false
      failed_when: false

    - name: Read current scan alias resolution (parents)
      ansible.builtin.command:
        argv:
          - postmap
          - -q
          - "scan-eltern@{{ mail_backend_paperless_scan_domain }}"
          - "hash:{{ paperless_audit_alias_map }}"
      register: paperless_audit_parents_alias
      changed_when: false
      failed_when: false

    - name: Summarize only prerequisites and disabled/enabled routing
      ansible.builtin.debug:
        msg:
          - "READ_ONLY: yes"
          - "Mailbox LDAP resolvable: {{ paperless_audit_ldap.rc == 0 }}"
          - "Mailbox list readable: {{ paperless_audit_folders.rc == 0 }}"
          - "Postfix + delimiter: {{ paperless_audit_postfix_delimiter.stdout | trim == '+' }}"
          - "Dovecot + delimiter: {{ paperless_audit_dovecot_delimiter.rc == 0 and paperless_audit_dovecot_delimiter.stdout | trim == '+' }}"
          - "Sieve package installed: {{ paperless_audit_package.rc == 0 and 'install ok installed' in paperless_audit_package.stdout }}"
          - "Family address resolves correctly: {{ paperless_audit_family_alias.stdout | trim == (paperless_audit_account ~ '+familie@' ~ mail_backend_primary_domain) }}"
          - "Parents address resolves correctly: {{ paperless_audit_parents_alias.stdout | trim == (paperless_audit_account ~ '+eltern@' ~ mail_backend_primary_domain) }}"
          - "No messages sent, no change performed. A route test still requires real SMTP -> LMTP delivery."
