---
# Explicit, guarded local-reservation recovery from controller.
# Never calls the selfHOST API, changes a certificate, or writes DNS.
# The default run installs the helper and performs read-only checks.
- name: Register the approved external certificate source
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate source and explicitly selected recovery scope
      ansible.builtin.assert:
        that:
          - mail_tls_source_address is defined
          - mail_tls_source_ssh_user is defined
          - selfhost_acme_zone is defined
          - selfhost_acme_record_ids is defined
          - selfhost_acme_record_ids | length == 2
          - selfhost_acme_nameservers is defined
          - selfhost_acme_nameservers | length >= 2
          - selfhost_acme_reconcile_instance is not defined or selfhost_acme_reconcile_instance is match('^[a-z0-9][a-z0-9_-]{0,31}$')
          - selfhost_acme_reconcile_instance is not defined or (selfhost_acme_instance is defined and selfhost_acme_reconcile_instance == selfhost_acme_instance)
        fail_msg: Invalid recovery target; no remote changes performed
      no_log: true

    - name: Register only the configured source host
      ansible.builtin.add_host:
        name: selfhost-acme-recovery-source
        groups: selfhost_acme_recovery_sources
        ansible_host: "{{ mail_tls_source_address }}"
        ansible_user: "{{ mail_tls_source_ssh_user }}"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

- name: Inspect or explicitly clear only abandoned local ACME reservations
  hosts: selfhost_acme_recovery_sources
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Install generic protected reconciliation helper from controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/selfhost_acme_recover.py"
        dest: /usr/local/libexec/selfhost_acme_recover.py
        owner: root
        group: root
        mode: '0755'

    - name: Confirm known reserved slots and authoritative DNS idle values
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/python3', '/usr/local/libexec/selfhost_acme_recover.py', '--check'] + (['--instance', selfhost_acme_reconcile_instance] if selfhost_acme_reconcile_instance is defined else []) }}"
      register: selfhost_acme_recovery_preflight
      changed_when: false

    - name: Report safe recovery preflight
      ansible.builtin.debug:
        var: selfhost_acme_recovery_preflight.stdout

    - name: Reconcile orphaned state only when explicitly authorized
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/python3', '/usr/local/libexec/selfhost_acme_recover.py', '--apply'] + (['--instance', selfhost_acme_reconcile_instance] if selfhost_acme_reconcile_instance is defined else []) }}"
      when: selfhost_acme_reconcile_apply | default(false) | bool
      register: selfhost_acme_recovery_applied
      changed_when: "'RECONCILED:' in selfhost_acme_recovery_applied.stdout"

    - name: Report whether recovery changed any local state
      ansible.builtin.debug:
        var: selfhost_acme_recovery_applied.stdout
      when: selfhost_acme_reconcile_apply | default(false) | bool
