---
# Strictly read-only TLS certificate preflight; site identities are local.
# No slurp/fetch/copy of a private key, no file writes, no service changes.
# Source is registered ephemerally; site-specific SSH credentials stay local.
- name: Register certificate source without modifying inventory files
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require explicit site-local TLS inventory and identity variables
      ansible.builtin.assert:
        that:
          - mail_tls_target_inventory_host is defined
          - mail_tls_target_inventory_host in groups['all']
          - mail_tls_source_address is defined
          - mail_tls_source_address is string
          - mail_tls_source_address | length > 0
          - mail_tls_source_cert_file is defined
          - mail_tls_source_key_file is defined
          - mail_tls_required_san is defined
          - mail_tls_expected_fqdn is defined
          - mail_tls_target_cert_file is defined
          - mail_tls_target_key_file is defined
          - not ansible_check_mode
        fail_msg: "Site-local source/target variables required; check mode unsupported"

    - name: Register source as an ephemeral read-only audit target
      ansible.builtin.add_host:
        name: mail-tls-source
        groups: mail_tls_certificate_sources
        ansible_host: "{{ mail_tls_source_address }}"
        ansible_user: "{{ mail_tls_source_ssh_user | default(omit) }}"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

- name: Validate certificate and private key on source without extracting either
  hosts: mail_tls_certificate_sources
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Require explicit absolute and distinct source paths
      ansible.builtin.assert:
        that:
          - mail_tls_source_cert_file is match('^/')
          - mail_tls_source_key_file is match('^/')
          - mail_tls_source_cert_file != mail_tls_source_key_file
          - mail_tls_required_san.startswith('*.')
          - mail_tls_expected_fqdn.endswith(mail_tls_required_san[1:])
          - mail_tls_expected_fqdn.count('.') == mail_tls_required_san.count('.')

    - name: Inspect source certificate metadata only
      ansible.builtin.stat:
        path: "{{ mail_tls_source_cert_file }}"
        follow: true
      register: source_cert_stat

    - name: Inspect source private-key metadata only
      ansible.builtin.stat:
        path: "{{ mail_tls_source_key_file }}"
        follow: true
      register: source_key_stat
      no_log: true

    - name: Require source certificate and key to be regular files
      ansible.builtin.assert:
        that:
          - source_cert_stat.stat.isreg | default(false)
          - source_key_stat.stat.isreg | default(false)
        fail_msg: "Expected source TLS files not found; check source path overrides"

    - name: Require certificate to remain valid for at least 30 days
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ mail_tls_source_cert_file }}"
          - -noout
          - -checkend
          - "2592000"
      register: source_validity
      changed_when: false
      failed_when: false

    - name: Read public certificate SAN (never the private key)
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ mail_tls_source_cert_file }}"
          - -noout
          - -ext
          - subjectAltName
      register: source_san
      changed_when: false
      failed_when: false
      no_log: true

    - name: Obtain public-key SHA-256 fingerprint from certificate
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -in {{ mail_tls_source_cert_file | quote }} -noout -pubkey |
          openssl pkey -pubin -outform DER |
          openssl dgst -sha256
      args:
        executable: /bin/bash
      register: source_cert_pubkey_digest
      changed_when: false
      no_log: true

    - name: Obtain public-key SHA-256 fingerprint from private key without exporting key
      ansible.builtin.shell: |
        set -o pipefail
        openssl pkey -in {{ mail_tls_source_key_file | quote }} -pubout -outform DER |
          openssl dgst -sha256
      args:
        executable: /bin/bash
      register: source_key_pubkey_digest
      changed_when: false
      no_log: true

    - name: Fail closed unless wildcard SAN, expiry, and public keys match
      ansible.builtin.assert:
        that:
          - source_validity.rc == 0
          - source_san.rc == 0
          - "mail_tls_required_san in (source_san.stdout | regex_findall('DNS:([^, ]+)'))"
          - source_cert_pubkey_digest.stdout is match('^SHA2-256\\(stdin\\)= [0-9a-f]{64}$')
          - source_cert_pubkey_digest.stdout == source_key_pubkey_digest.stdout
        fail_msg: "Source TLS evidence invalid: stop; do not transfer certificate or private key"

    - name: Read certificate expiry for sanitized report
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ mail_tls_source_cert_file }}"
          - -noout
          - -enddate
      register: source_enddate
      changed_when: false

    - name: Retain only public certificate evidence
      ansible.builtin.set_fact:
        source_mail_tls_public_evidence:
          source: "{{ ansible_host }}"
          certificate_path: "{{ mail_tls_source_cert_file }}"
          certificate_public_key_sha256: "{{ source_cert_pubkey_digest.stdout.split('= ')[-1] }}"
          not_after: "{{ source_enddate.stdout }}"
          wildcard_san_present: true
          valid_for_30_days: true
          certificate_and_key_match: true
      no_log: true

- name: Inspect effective Postfix and Dovecot TLS paths on configured target
  hosts: "{{ mail_tls_target_inventory_host }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Refuse target checks unless source certificate and key passed validation
      ansible.builtin.assert:
        that:
          - hostvars['mail-tls-source'].source_mail_tls_public_evidence is defined
        fail_msg: "Source evidence unavailable or invalid; target preflight skipped"
      changed_when: false

    - name: Read effective Postfix TLS certificate path
      ansible.builtin.command:
        argv: [postconf, -h, smtpd_tls_cert_file]
      register: mail_postfix_cert
      changed_when: false

    - name: Read effective Postfix TLS private-key path
      ansible.builtin.command:
        argv: [postconf, -h, smtpd_tls_key_file]
      register: mail_postfix_key
      changed_when: false

    - name: Read effective Postfix host identity
      ansible.builtin.command:
        argv: [postconf, -h, myhostname]
      register: mail_postfix_hostname
      changed_when: false

    - name: Read effective Dovecot TLS certificate path
      ansible.builtin.command:
        argv: [doveconf, -h, ssl_server/cert_file]
      register: mail_dovecot_cert
      changed_when: false
      no_log: true

    - name: Read effective Dovecot TLS private-key path
      ansible.builtin.command:
        argv: [doveconf, -h, ssl_server/key_file]
      register: mail_dovecot_key
      changed_when: false
      no_log: true

    - name: Require both services to use the approved target paths and hostname
      ansible.builtin.assert:
        that:
          - mail_postfix_hostname.stdout | trim == mail_tls_expected_fqdn
          - mail_postfix_cert.stdout | trim == mail_tls_target_cert_file
          - mail_postfix_key.stdout | trim == mail_tls_target_key_file
          - mail_dovecot_cert.stdout | trim == mail_tls_target_cert_file
          - mail_dovecot_key.stdout | trim == mail_tls_target_key_file
        fail_msg: "Mail service name or live TLS paths differ; stop before certificate distribution"

    - name: Retain sanitized target configuration evidence
      ansible.builtin.set_fact:
        mail_tls_target_evidence:
          fqdn: "{{ mail_tls_expected_fqdn }}"
          certificate_path: "{{ mail_tls_target_cert_file }}"
          key_path: "{{ mail_tls_target_key_file }}"
          postfix_matches: true
          dovecot_matches: true
      changed_when: false

- name: Report read-only readiness for later certificate deployment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require both independently captured evidence sets
      ansible.builtin.assert:
        that:
          - hostvars['mail-tls-source'].source_mail_tls_public_evidence is defined
          - hostvars[mail_tls_target_inventory_host].mail_tls_target_evidence is defined

    - name: Publish non-secret readiness summary (no transfer authorization)
      ansible.builtin.debug:
        msg:
          verification: PASS
          mode: READ_ONLY
          changed: false
          source: "{{ hostvars['mail-tls-source'].source_mail_tls_public_evidence }}"
          target: "{{ hostvars[mail_tls_target_inventory_host].mail_tls_target_evidence }}"
          private_key_transferred: false
          service_reloaded: false
          can_authorize_deployment: false
          next: "Review source paths, key handling, destination ownership and transactional reload before deployment"
