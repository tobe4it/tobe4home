name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ansible-core>=2.18,<2.20' 'pytest>=8,<10' 'PyYAML>=6,<7' 'Jinja2>=3,<4' 'reportlab>=4,<5'

      - name: Bootstrap shell syntax
        run: |
          bash -n bootstrap/bootstrap.sh
          bash -n bootstrap/launch.sh
          bash -n bootstrap/installer-tui.sh

      - name: Python regression tests
        run: python -m pytest -q tests

      - name: Bilingual handbook and blank recovery PDFs
        run: python scripts/check_handbook.py
